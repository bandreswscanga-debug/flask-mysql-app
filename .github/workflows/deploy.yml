name: CI/CD Pipeline - Build, Test, Security & Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Ejecutar Pruebas Unitarias
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del codigo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Ejecutar pruebas con Pytest
        run: pytest test_app.py -v

  security-scan:
    name: Escaneo de Seguridad (Bandit + Trivy)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout del codigo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar Bandit (SAST)
        run: pip install bandit

      - name: Ejecutar Bandit (SAST Python)
        run: |
          bandit -r . -f json -o bandit-report.json || true
          echo "=== Resultado Bandit (falla en severidad alta/critica) ==="
          bandit -r . -lll

      - name: Instalar Trivy
        run: |
          sudo apt-get install -y wget apt-transport-https gnupg lsb-release
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | gpg --dearmor | sudo tee /usr/share/keyrings/trivy.gpg > /dev/null
          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb $(lsb_release -sc) main" | sudo tee /etc/apt/sources.list.d/trivy.list
          sudo apt-get update
          sudo apt-get install -y trivy

      - name: Construir imagen Docker para escaneo
        run: docker build -t scanned-image .

      - name: Ejecutar Trivy (Container Scanning)
        run: |
          trivy image --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed scanned-image

  deploy:
    name: Desplegar en EC2
    runs-on: ubuntu-latest
    needs: [test, security-scan]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout del codigo
        uses: actions/checkout@v4

      - name: Configurar SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.EC2_SSH_KEY }}

      - name: Agregar host known
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      - name: Clonar o actualizar repositorio en EC2
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} \
            "sudo mkdir -p /opt/proyecto-sre && sudo chown -R ${{ secrets.EC2_USER }}:${{ secrets.EC2_USER }} /opt/proyecto-sre && cd /opt/proyecto-sre && if [ -d .git ]; then git pull origin main; else git clone https://github.com/${{ github.repository }}.git .; fi"

      - name: Desplegar con Docker Compose en EC2
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} \
            "cd /opt/proyecto-sre && [ -f .env ] || cp .env.example .env && docker compose up -d --build"

      - name: Verificar despliegue
        run: |
          sleep 15
          ssh -o StrictHostKeyChecking=no ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} \
            "curl -s -o /dev/null -w '%{http_code}' http://localhost:5000/"
