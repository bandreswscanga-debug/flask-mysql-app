services:
  servidor-api:
    build: .
    container_name: servidor-api-ejemplo
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - DB_HOST=servidor-bd-ejemplo
      - DB_USER=${DB_USER}
      - DB_PASS=${DB_PASS}
      - DB_NAME=${DB_NAME}
    mem_limit: 256m
    depends_on:
      servidor-bd:
        condition: service_healthy
    networks:
      - red-internal

  servidor-bd:
    image: mysql:8.0
    container_name: servidor-bd-ejemplo
    restart: unless-stopped
    command: --innodb-buffer-pool-size=64M --max_connections=50 --performance-schema=0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    mem_limit: 400m
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - red-internal

  nginx-proxy:
    image: jc21/nginx-proxy-manager:latest
    container_name: nginx-proxy-manager
    restart: unless-stopped
    mem_limit: 256m
    ports:
      - "80:80"
      - "443:443"
      - "81:81"
    volumes:
      - ./nginx/data:/data
      - ./nginx/letsencrypt:/etc/letsencrypt
    networks:
      - red-internal

  uptime-kuma:
    image: louislam/uptime-kuma:latest
    container_name: uptime-kuma
    restart: unless-stopped
    mem_limit: 256m
    ports:
      - "3001:3001"
    volumes:
      - uptime-kuma_data:/app/data
    networks:
      - red-internal

  dozzle:
    image: amir20/dozzle:latest
    container_name: dozzle
    restart: unless-stopped
    mem_limit: 128m
    ports:
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./dozzle/data:/data
    environment:
      - DOZZLE_AUTH_PROVIDER=simple
    networks:
      - red-internal

volumes:
  mysql_data:
  uptime-kuma_data:

networks:
  red-internal:
    driver: bridge
